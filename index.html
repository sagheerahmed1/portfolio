function getBotResponse(input) {
  const lower = input.toLowerCase();
  for (const item of BOT_RESPONSES) {
    if (item.keywords.some(kw => lower.includes(kw))) return item.response;
  }
  return "Great question! Try asking about Sagheer's skills, projects, experience, or how to contact him. 😊";
}

function applyTheme(dark) {
  const r = document.documentElement.style;
  r.setProperty('--bg',           dark ? '#2F3E46' : '#EEF4F2');
  r.setProperty('--bg-alt',       dark ? '#263238' : '#CAD2C5');
  r.setProperty('--card',         dark ? '#354F52' : '#FFFFFF');
  r.setProperty('--accent',       '#52796F');
  r.setProperty('--accent-light', dark ? 'rgba(82,121,111,0.22)' : 'rgba(82,121,111,0.12)');
  r.setProperty('--text-heading', dark ? '#CAD2C5' : '#2F3E46');
  r.setProperty('--text',         dark ? '#CAD2C5' : '#354F52');
  r.setProperty('--text-muted',   dark ? '#84A98C' : '#52796F');
  r.setProperty('--border',       dark ? '#3D5A5E' : '#B8C5BF');
  r.setProperty('--shadow',       dark ? 'rgba(0,0,0,0.3)' : 'rgba(47,62,70,0.08)');
  r.setProperty('--shadow-hover', dark ? 'rgba(0,0,0,0.45)' : 'rgba(47,62,70,0.14)');
  r.setProperty('--nav-bg',       dark ? 'rgba(47,62,70,0.95)' : 'rgba(238,244,242,0.95)');
  r.setProperty('--input-bg',     dark ? '#263238' : '#E6EFEC');
  document.body.style.backgroundColor = dark ? '#2F3E46' : '#EEF4F2';
  document.body.style.color = dark ? '#CAD2C5' : '#354F52';
  document.body.style.transition = 'background-color 0.3s ease, color 0.3s ease';
}

function Navbar({ dark, toggleDark }) {

    const fn = () => setScrolled(window.scrollY > 50);
    window.addEventListener('scroll', fn);
    return () => window.removeEventListener('scroll', fn);
  }, []);

    {label:'About',href:'#about'},{label:'Skills',href:'#skills'},
    {label:'Projects',href:'#projects'},{label:'Power BI',href:'#powerbi'},{label:'Contact',href:'#contact'},
  ];

    <nav style={{ position:'fixed', top:0, left:0, right:0, zIndex:1000, background:'var(--nav-bg)', backdropFilter:'blur(12px)', borderBottom: scrolled ? '1px solid var(--border)' : '1px solid transparent', transition:'all 0.3s ease', padding:'0 2rem' }}>
      <div style={{ maxWidth:1200, margin:'0 auto', display:'flex', alignItems:'center', justifyContent:'space-between', height:64 }}>

          <span style={{ fontWeight:700, fontSize:16, color:'var(--text-heading)' }}>Sagheer Ahmed</span>
        </a>
        <div className="desktop-nav" style={{ display:'flex', alignItems:'center', gap:'1.5rem' }}>
          {links.map(l => (
            <a key={l.label} href={l.href} style={{ textDecoration:'none', color:'var(--text-muted)', fontSize:14, transition:'color 0.2s ease' }}
              onMouseEnter={e => e.target.style.color='var(--accent)'}
              onMouseLeave={e => e.target.style.color='var(--text-muted)'}>{l.label}</a>
          ))}
          <button onClick={toggleDark} style={{ background:'var(--accent-light)', border:'1px solid var(--border)', borderRadius:20, padding:'6px 12px', cursor:'pointer', display:'flex', alignItems:'center', gap:6, color:'var(--accent)', fontSize:14, transition:'all 0.2s ease' }}

            onMouseLeave={e => { e.currentTarget.style.background='var(--accent-light)'; e.currentTarget.style.color='var(--accent)'; }}>
            {dark ? '☀️' : '🌙'} <span style={{ fontSize:12 }}>{dark ? 'Light' : 'Dark'}</span>
          </button>
        </div>
        <button className="mobile-menu-btn" onClick={() => setMenuOpen(!menuOpen)} style={{ display:'none', background:'none', border:'none', cursor:'pointer', color:'var(--text)', fontSize:22 }}>{menuOpen ? '✕' : '☰'}</button>
      </div>
      {menuOpen && (
        <div style={{ padding:'1rem 2rem 1.5rem', borderTop:'1px solid var(--border)', display:'flex', flexDirection:'column', gap:'1rem', background:'var(--nav-bg)' }}>
          {links.map(l => <a key={l.label} href={l.href} onClick={() => setMenuOpen(false)} style={{ textDecoration:'none', color:'var(--text)', fontSize:15 }}>{l.label}</a>)}
          <button onClick={() => { toggleDark(); setMenuOpen(false); }} style={{ background:'var(--accent-light)', border:'1px solid var(--border)', borderRadius:20, padding:'8px 16px', cursor:'pointer', color:'var(--accent)', fontSize:14, width:'fit-content' }}>{dark ? '☀️ Light' : '🌙 Dark'}</button>
        </div>
      )}
    </nav>
  );
}

          <div style={{ display:'flex', flexDirection:'column', gap:'1rem' }}>
            {socials.map((s,i) => (
              <a key={i} href={s.href} target="_blank" rel="noreferrer" style={{ display:'flex', alignItems:'center', gap:14, background:'var(--card)', border:'1px solid var(--border)', borderRadius:12, padding:'1rem 1.25rem', textDecoration:'none', transition:'all 0.2s ease' }}
                onMouseEnter={e => { e.currentTarget.style.borderColor='var(--accent)'; e.currentTarget.style.transform='translateX(4px)'; }}
                onMouseLeave={e => { e.currentTarget.style.borderColor='var(--border)'; e.currentTarget.style.transform='translateX(0)'; }}>
                <span style={{ fontSize:24 }}>{s.icon}</span>
                <div>
                  <p style={{ fontSize:11, color:'var(--text-muted)', margin:0, fontWeight:600, textTransform:'uppercase', letterSpacing:'0.05em' }}>{s.label}</p>
                  <p style={{ fontSize:14, color:'var(--accent)', margin:0, fontWeight:600 }}>{s.value}</p>
                </div>
                <span style={{ marginLeft:'auto', color:'var(--text-muted)', fontSize:14 }}>→</span>
              </a>
            ))}
            <div style={{ background:'var(--card)', border:'1px solid var(--border)', borderRadius:12, padding:'1.25rem', marginTop:'0.5rem' }}>
              <p style={{ fontWeight:700, color:'var(--text)', fontSize:14, marginBottom:'0.5rem' }}>🌍 Availability</p>
              <p style={{ fontSize:13, color:'var(--text-muted)', lineHeight:1.7, margin:0 }}>Based in Rawalpindi, Pakistan · IST (UTC+5)<br/>Available for full-time remote roles globally.<br/>Open to relocation for the right opportunity.</p>
            </div>
          </div>
          <form onSubmit={handleSubmit}>
            <div style={{ display:'flex', flexDirection:'column', gap:'1rem' }}>
              {[['name','Your Name','John Smith','text'],['email','Email Address','john@company.com','email']].map(([key,label,ph,type]) => (
                <div key={key}>
                  <label style={{ display:'block', fontSize:13, fontWeight:600, color:'var(--text)', marginBottom:6 }}>{label}</label>
                  <input required type={type} value={form[key]} onChange={e => setForm({...form,[key]:e.target.value})} placeholder={ph} style={inp}
                    onFocus={e => e.target.style.borderColor='var(--accent)'}
                    onBlur={e => e.target.style.borderColor='var(--border)'} />
                </div>
              ))}
              <div>
                <label style={{ display:'block', fontSize:13, fontWeight:600, color:'var(--text)', marginBottom:6 }}>Message</label>
                <textarea required value={form.message} onChange={e => setForm({...form,message:e.target.value})} placeholder="I'd like to discuss a Data Analyst opportunity..." rows={5} style={{...inp,resize:'vertical'}}
                  onFocus={e => e.target.style.borderColor='var(--accent)'}
                  onBlur={e => e.target.style.borderColor='var(--border)'} />
              </div>
              {sent && <div style={{ background:'rgba(34,197,94,0.15)', border:'1px solid rgba(34,197,94,0.3)', borderRadius:8, padding:'0.75rem 1rem', fontSize:13, color:'#22C55E', fontWeight:600 }}>✓ Message sent! Sagheer will respond within 24 hours.</div>}
              <button type="submit" style={{ background:'var(--accent)', color:'#fff', border:'none', borderRadius:10, padding:'12px 24px', fontWeight:700, fontSize:15, cursor:'pointer', transition:'all 0.2s ease' }}
                onMouseEnter={e => { e.currentTarget.style.transform='translateY(-2px)'; e.currentTarget.style.boxShadow='0 6px 20px rgba(82,121,111,0.4)'; }}
                onMouseLeave={e => { e.currentTarget.style.transform='translateY(0)'; e.currentTarget.style.boxShadow='none'; }}>
                Send Message →
              </button>
            </div>
          </form>
        </div>
      </div>
    </section>
  );
}

function Footer() {
  return (
    <footer style={{ background:'var(--bg)', borderTop:'1px solid var(--border)', padding:'2rem', textAlign:'center' }}>
      <p style={{ fontSize:13, color:'var(--text-muted)' }}>
        Built with React · Designed by <a href="https://github.com/sagheerahmed1" style={{ color:'var(--accent)', textDecoration:'none', fontWeight:600 }}>Sagheer Ahmed</a> · {new Date().getFullYear()}
      </p>
    </footer>
  );
}

function App() {
  const [dark, setDark] = useState(() => {
    try { const s = localStorage.getItem('sagheer-theme'); if (s) return s==='dark'; return window.matchMedia('(prefers-color-scheme: dark)').matches; } catch { return false; }
  });
  useEffect(() => { applyTheme(dark); }, [dark]);
  useEffect(() => { applyTheme(dark); }, []);
  const toggleDark = () => setDark(prev => { const next = !prev; try { localStorage.setItem('sagheer-theme', next?'dark':'light'); } catch {} return next; });
  return (
    <>
      <Navbar dark={dark} toggleDark={toggleDark} />
      <main>
        <Hero dark={dark} />
        <About />
        <Skills />
        <Projects />
        <PowerBI />
        <Contact />
      </main>
      <Footer />
      <Chatbot />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
